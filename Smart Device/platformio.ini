; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mhetesp32devkit]
platform = espressif32
board = mhetesp32devkit
framework = arduino

# TFT display library for hardware demo
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.23
    bblanchon/ArduinoJson @ ^7.0.4

# Build flags for TFT_eSPI configuration
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_2_DRIVER
    -DUSE_HSPI_PORT
    -DTFT_CS=15
    -DTFT_RST=16
    -DTFT_DC=17
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_MISO=19
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_ROTATION=0
    -DSPI_FREQUENCY=20000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DCGRAM_OFFSET

# Additional settings for development
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

# ── Dev / test overrides ───────────────────────────────────────────────────
# Uncomment and fill in the three lines below to skip the provisioning portal.
# The device will connect directly to the Wi-Fi and server without setup flow.
#
#    -DDEV_WIFI_SSID=\"YourSSID\"
#    -DDEV_WIFI_PASS=\"YourPassword\"
#    -DDEV_SERVER_URL=\"http://192.168.1.10:8000\"
#    -DDEV_PAIRING_CODE=\"DEMO-001\"
